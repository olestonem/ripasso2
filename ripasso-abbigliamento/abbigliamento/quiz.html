<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Attività — Abbigliamento</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet"><style>
:root{--bg:#f4f5f7;--paper:#fff;--ink:#18202b;--muted:#687180;--line:#dfe3e8;--yellow:#ffd84d;--yellow-soft:#fff4bf;--blue:#dcecff;--blue-strong:#3767d6;--green:#dff3e8;--pink:#f8dfeb;--orange:#ffe5cc;--red:#f7dfe0;--shadow:0 18px 45px rgba(24,32,43,.08);--radius:24px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}.page{max-width:980px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0 22px}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--yellow);display:grid;place-items:center;font-size:20px;transform:rotate(-5deg)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;font-size:13px;color:var(--muted);font-weight:700;cursor:pointer;font-family:inherit}.nav a:hover,.nav button:hover{color:var(--ink);background:#fbfbfc}.head{margin:24px 0 14px;display:flex;align-items:end;justify-content:space-between;gap:18px}.eyebrow{display:inline-flex;background:var(--yellow-soft);border:1px solid #f0d76b;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.head h1{font-size:clamp(38px,6vw,62px);line-height:.95;letter-spacing:-.055em;margin:16px 0 8px}.head p{margin:0;color:var(--muted);font-size:17px}.progress{min-width:170px;text-align:right;color:var(--muted);font-size:13px;font-weight:700}.bar{height:8px;background:#e8ebef;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;background:var(--ink);border-radius:99px;transition:width .25s}.card{background:var(--paper);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);padding:42px;min-height:500px;display:flex;flex-direction:column}.type-label{font-size:13px;color:var(--muted);font-weight:80
